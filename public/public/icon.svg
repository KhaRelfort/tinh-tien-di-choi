<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="236"/>
    </clipPath>
  </defs>

  <!-- Green Circle Background -->
  <circle cx="256" cy="256" r="236" fill="#43aa44"/>

  <!-- Content clipped to the circle -->
  <g clip-path="url(#circleClip)">
    <!-- 45-degree Long Shadow -->
    <path d="
      M 346 122
      L 512 288
      L 512 512
      L 290 512
      L 124 346
      L 124 170
      Z
    " fill="#2d7b32" opacity="0.6"/>

    <!-- Leftmost Bill Strip 1 -->
    <path d="M 178 175 L 186 98 A 15 15 0 0 1 215 95 L 206 175 Z" fill="#ffffff"/>
    
    <!-- Middle Bill Strip 2 -->
    <path d="M 218 175 L 227 90 A 15 15 0 0 1 257 86 L 246 175 Z" fill="#ffffff"/>

    <!-- Large Folded Bill (top-right) -->
    <path d="
      M 260 175
      L 272 88
      A 16 16 0 0 1 292 74
      L 358 108
      A 16 16 0 0 1 366 130
      L 348 175
      Z
    " fill="#ffffff"/>

    <!-- Cutout inside large bill -->
    <path d="
      M 288 165
      L 296 114
      A 8 8 0 0 1 306 107
      L 336 122
      A 8 8 0 0 1 340 133
      L 330 165
      Z
    " fill="#43aa44"/>

    <!-- Half Coin peaking behind wallet front -->
    <circle cx="295" cy="168" r="33" fill="#ffffff"/>

    <!-- Back flap of wallet (top left curve) -->
    <path d="
      M 124 195
      L 124 162
      A 26 26 0 0 1 150 136
      L 186 136
      A 15 15 0 0 1 201 151
      L 201 170
      L 155 170
      A 18 18 0 0 0 137 188
      Z
    " fill="#ffffff"/>

    <!-- Main Front Wallet Body -->
    <rect x="124" y="170" width="235" height="176" rx="30" fill="#ffffff"/>

    <!-- Wallet Clasp / Buckle on the right -->
    <path d="
      M 345 220
      L 380 220
      A 35 35 0 0 1 380 290
      L 345 290
      Z
    " fill="#ffffff"/>

    <!-- Hole/snap inside clasp -->
    <circle cx="372" cy="255" r="11" fill="#43aa44"/>

    <!-- Dollar Symbol ($) on the Wallet Front -->
    <!-- Vertical line of $ -->
    <line x1="232" y1="210" x2="232" y2="306" stroke="#43aa44" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Path of S curve for $ -->
    <path d="
      M 256 238
      C 256 222, 210 220, 210 240
      C 210 264, 256 254, 256 276
      C 256 296, 208 296, 208 278
    " fill="none" stroke="#43aa44" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
